[project]
name = "governed-banking-policy-assistant"
version = "0.1.0"
description = "Internal staff-facing multi-agent assistant answering questions over synthetic banking policies, with deterministic governance controls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "langgraph>=0.2.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "groq>=0.13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
